<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>rust-vite-template</title>
    <script>
      // Applies the user's theme before first paint, so a dark page never flashes light.
      // `src/lib/theme.tsx` owns the key and keeps it applied from here on.
      try {
        var theme = localStorage.getItem("app-theme");
        if (
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
      // The org's custom theme as last loaded (`src/lib/theming/`, which refreshes it), so a
      // restyled page never flashes the defaults.
      try {
        var css = localStorage.getItem("app-theme-css");
        if (css) {
          var style = document.createElement("style");
          style.id = "app-theme";
          style.textContent = css;
          document.head.appendChild(style);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
