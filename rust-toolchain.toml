# Pinned to the workspace MSRV, 1.97.1 (rig-bedrock 0.46's declared
# rust-version), so local builds and clippy match CI. The `rust-version` field
# in the root Cargo.toml is what actually enforces the floor; keep this, CI,
# mise.toml and the Packer `rust_version` in step with it.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
