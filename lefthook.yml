# Git hooks via lefthook. Install once with `lefthook install`.
pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --features server/seed -- -D warnings
    biome:
      # `root` makes {staged_files} relative to frontend/ (and keeps only files under it).
      root: "frontend/"
      glob: "*.{ts,tsx,js,json}"
      run: pnpm biome ci {staged_files}
    tsc:
      glob: "frontend/**/*.{ts,tsx}"
      run: cd frontend && pnpm run typecheck
