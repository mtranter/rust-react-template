[workspace]
resolver = "3"
members = [
    "crates/common/*",
    # Every module's `core` and `api` crates, so a new module needs no entry here.
    "crates/modules/*/*",
    # What `make new-module` copies, `core` and `api`: compiled, linted and
    # tested like a module, but registered with no server.
    "crates/module-template/*",
    "crates/server",
]

[workspace.package]
edition = "2024"
# sqlx 0.9 declares rust-version 1.94 (edition 2024 alone would need 1.85).
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
app-domain = { path = "crates/common/domain" }
app-error = { path = "crates/common/error" }
app-events = { path = "crates/common/events" }
app-persistence = { path = "crates/common/persistence" }
app-web = { path = "crates/common/web" }
app-db = { path = "crates/common/db" }
app-test-support = { path = "crates/common/test-support" }
app-module = { path = "crates/common/module" }
users-api = { path = "crates/modules/users/api" }
users = { path = "crates/modules/users/core" }
notes-api = { path = "crates/modules/notes/api" }
notes = { path = "crates/modules/notes/core" }
note-search = { path = "crates/modules/note-search/core" }

# poem 3.1.x <-> poem-openapi 5.1.x are released in lockstep; bump together.
poem = "3.1"
poem-openapi = { version = "5.1", features = ["swagger-ui"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

async-trait = "0.1"
thiserror = "2"
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# `rust_crypto`: no global crypto provider to install, no aws-lc-rs/cmake (spec §14).
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# No default-tls: reuses the `ring` provider sqlx already brings, so no system
# OpenSSL and no aws-lc-rs/cmake (spec §14).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }

proptest = "1"
# Pinned to 1.0: its query API changed across 0.x.
jsonpath-rust = "1.0"
assert-json-diff = "2.0"

# Repo-local dev tools, installed into ./.bin by `make setup` (cargo-run-bin).
# Two-component versions need a range qualifier: `cargo install --version` reads
# a bare "0.20" as an incomplete exact version.
[workspace.metadata.bin]
cargo-deny = { version = "^0.20" }
cargo-watch = { version = "8.5.3" }
# Must match the sqlx lib's 0.9 line; rustls avoids native-tls/openssl.
sqlx-cli = { version = "^0.9", bins = ["sqlx"], default-features = false, features = [
    "rustls",
    "postgres",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
