[workspace]
resolver = "3"
members = [
    "crates/common/*",
    # Every module's `core` and `api` crates, in `crates/modules/`, the
    # platform's in `crates/platform/` and the reference modules in
    # `crates/reference/` (see crates/AGENTS.md), so a new
    # module needs no entry here. Cargo reads a glob matching nothing as a path,
    # so `crates/modules/*/*` would fail while there are no modules.
    "crates/*/*/core",
    "crates/*/*/api",
    # What `make new-module` copies, `core` and `api`: compiled, linted and
    # tested like a module, but registered with no server.
    "crates/module-template/*",
    # The journeys over the reference modules, whether or not the server registers them.
    "crates/reference/journeys",
    "crates/server",
]

[workspace.package]
edition = "2024"
# sqlx 0.9 declares rust-version 1.94 (edition 2024 alone would need 1.85).
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
app-domain = { path = "crates/common/domain" }
app-bus = { path = "crates/common/bus" }
app-error = { path = "crates/common/error" }
app-events = { path = "crates/common/events" }
app-persistence = { path = "crates/common/persistence" }
app-web = { path = "crates/common/web" }
app-db = { path = "crates/common/db" }
app-test-support = { path = "crates/common/test-support" }
app-fake-oidc = { path = "crates/common/fake-oidc" }
app-test-db = { path = "crates/common/test-db" }
app-test-db-macros = { path = "crates/common/test-db-macros" }
app-module = { path = "crates/common/module" }
app-authz = { path = "crates/common/authz" }
server = { path = "crates/server" }
access-api = { path = "crates/platform/access/api" }
access = { path = "crates/platform/access/core" }
users-api = { path = "crates/reference/users/api" }
users = { path = "crates/reference/users/core" }
notes-api = { path = "crates/reference/notes/api" }
notes = { path = "crates/reference/notes/core" }
note-search = { path = "crates/reference/note-search/core" }

# poem 3.1.x <-> poem-openapi 5.1.x are released in lockstep; bump together.
poem = "3.1"
poem-openapi = { version = "5.1", features = ["swagger-ui"] }
# MCP's protocol and streamable HTTP transport, on poem 3.1 (MSRV 1.85).
poem-mcpserver = { version = "0.3", features = ["streamable-http"] }
percent-encoding = "2"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

async-trait = "0.1"
futures-util = "0.3"
# `app-bus`'s adapter (ADR 0039): Redis/Valkey pub/sub, over TLS with
# `rediss://`. rustls with webpki roots; no native certs or OpenSSL.
redis = { version = "1", default-features = false, features = [
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
    "connection-manager",
] }
# A Valkey per test that needs one (ADR 0039), on a port Docker picks.
testcontainers = "0.28"
# A throwaway CA and certificate for a test's Valkey reached over TLS.
rcgen = "0.14"
thiserror = "2"
# Policy files (ADR 0040): serde_yaml is archived, and saphyr's marked tree
# gives every node its line, which each refusal names.
saphyr = "0.3"
# The rule set in force, swapped whole when grants change (ADR 0040).
arc-swap = "1"
# A resource's closed `Action` enum and its names (`app_authz::Action`).
strum = { version = "0.28", features = ["derive"] }
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
# Only for the level `sqlx::pool::PoolOptions::acquire_time_level` takes.
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
# OpenTelemetry (ADR 0026): opentelemetry, opentelemetry_sdk, opentelemetry-otlp and
# opentelemetry-http 0.33.x <-> tracing-opentelemetry 0.34.x are a matched set; bump them together.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
# `internal-logs`: the SDK's own warnings (a dropped span, a failed export) as
# `tracing` events, which `server::telemetry` lets through at most once a minute.
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "trace",
    "metrics",
    "internal-logs",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "metrics",
    "http-proto",
    "http-json",
    "internal-logs",
] }
# The OTLP exporter's HTTP client trait, implemented over the reqwest below.
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# `rust_crypto`: no global crypto provider to install, no aws-lc-rs/cmake (ADR 0005).
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# No default-tls: reuses the `ring` provider sqlx already brings, so no system
# OpenSSL and no aws-lc-rs/cmake (ADR 0005).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }

proptest = "1"
# Pinned to 1.0: its query API changed across 0.x.
jsonpath-rust = "1.0"
assert-json-diff = "2.0"

# Repo-local dev tools, installed into ./.bin by `make setup` (cargo-run-bin).
# Two-component versions need a range qualifier: `cargo install --version` reads
# a bare "0.20" as an incomplete exact version.
[workspace.metadata.bin]
cargo-deny = { version = "^0.20" }
cargo-watch = { version = "8.5.3" }
# Compiler cache behind scripts/rustc-wrapper.sh; shared by every checkout on a machine.
sccache = { version = "^0.19" }
# Must match the sqlx lib's 0.9 line; rustls avoids native-tls/openssl.
sqlx-cli = { version = "^0.9", bins = ["sqlx"], default-features = false, features = [
    "rustls",
    "postgres",
] }

# Full debug info dominates incremental test builds (link time), measured at
# 8s → 3s after a module edit; line tables still give backtraces file:line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Unoptimised, `fake-oidc` (`make e2e`) takes 5-25s to make its RSA key; optimised, well under one.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
