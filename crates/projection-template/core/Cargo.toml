[package]
name = "widget-index"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# A read module keeping its own copy of another module's roots, from their
# topic (ADR 0036). What `make new-projection` copies: compiled and tested,
# registered with no server.

[dependencies]
app-error.workspace = true
app-events.workspace = true
widgets-api = { path = "../../module-template/api" }
app-persistence.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
app-web.workspace = true
app-db.workspace = true
app-module.workspace = true
poem.workspace = true
poem-openapi.workspace = true
sqlx.workspace = true

[dev-dependencies]
app-test-db.workspace = true
app-domain.workspace = true
# The provider runs for real in the tests: its migrations and its seed, which
# announces every seeded root. Test-only, so no core-to-core edge ships.
widgets = { path = "../../module-template/core", features = ["seed"] }
app-web = { workspace = true, features = ["test"] }
tokio = { workspace = true }
