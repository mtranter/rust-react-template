[package]
name = "users"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Pure crates — usable by the domain and application layers.
app-error.workspace = true
app-persistence.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# Framework-coupled — used only by the api and db layers.
app-web.workspace = true
app-db.workspace = true
poem.workspace = true
poem-openapi.workspace = true
sqlx.workspace = true
serde.workspace = true
tracing.workspace = true

[features]
# Deterministic, well-known seed data (`<module>::seed`). Off in production
# builds; this crate's own tests enable it via the self dev-dependency below.
seed = []

[dev-dependencies]
# Enables `seed` for this crate's integration tests.
users = { path = ".", features = ["seed"] }
app-test-support.workspace = true
app-error.workspace = true
app-web.workspace = true
poem = { workspace = true, features = ["test"] }
poem-openapi.workspace = true
tokio = { workspace = true }
proptest.workspace = true
serde_json.workspace = true
uuid.workspace = true
