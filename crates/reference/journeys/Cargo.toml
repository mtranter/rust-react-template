[package]
name = "reference-journeys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The reference modules composed as the template's server registers them, and
# the journeys over them. A composition of its own, so they run unchanged once
# an app's server registers its own modules instead.
[dependencies]
app-module.workspace = true
server.workspace = true
users.workspace = true
notes.workspace = true
note-search.workspace = true

[dev-dependencies]
app-db.workspace = true
app-domain.workspace = true
app-events.workspace = true
app-test-db.workspace = true
app-web = { workspace = true, features = ["test"] }
chrono.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# The seeds, and the seeded ids the journeys name.
users = { workspace = true, features = ["seed"] }
notes = { workspace = true, features = ["seed"] }
users-api = { workspace = true, features = ["seed"] }
notes-api = { workspace = true, features = ["seed"] }
