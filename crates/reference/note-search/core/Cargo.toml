[package]
name = "note-search"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# A read module (ADR 0010, 0036): it reads no other module's tables or views,
# only its own copy, kept from the providers' topics.

[dependencies]
app-authz.workspace = true
strum.workspace = true
app-error.workspace = true
app-events.workspace = true
notes-api.workspace = true
users-api.workspace = true
app-persistence.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
app-web.workspace = true
app-db.workspace = true
app-module.workspace = true
poem.workspace = true
poem-openapi.workspace = true
sqlx.workspace = true

[dev-dependencies]
app-authz.workspace = true
app-test-db.workspace = true
app-domain.workspace = true
# What the tests publish, as the providers would: their seed data as published.
users-api = { workspace = true, features = ["seed"] }
notes-api = { workspace = true, features = ["seed"] }
app-test-support.workspace = true
app-web = { workspace = true, features = ["test"] }
tokio = { workspace = true }
serde_json.workspace = true
