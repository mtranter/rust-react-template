[package]
name = "assistant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
app-authz.workspace = true
app-db.workspace = true
app-domain.workspace = true
app-error.workspace = true
app-events.workspace = true
app-module.workspace = true
app-persistence.workspace = true
app-web.workspace = true
assistant-api.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
poem.workspace = true
poem-openapi.workspace = true
rig-bedrock.workspace = true
rig-core = { workspace = true, features = ["reqwest", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[features]
# Never enabled in production builds.
seed = []

[dev-dependencies]
# Enables `seed` for this crate's integration tests.
assistant = { path = ".", features = ["seed"] }
app-authz = { workspace = true, features = ["testing"] }
app-domain.workspace = true
app-events.workspace = true
app-test-db.workspace = true
app-web = { workspace = true, features = ["test"] }
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
