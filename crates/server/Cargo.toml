[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "dump-spec"
path = "src/bin/dump-spec.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["seed"]

[dependencies]
app-db.workspace = true
app-domain.workspace = true
app-module.workspace = true
app-persistence.workspace = true
app-web.workspace = true
users.workspace = true
notes.workspace = true
note-search.workspace = true
poem.workspace = true
poem-openapi.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true

# Optional so the backend builds before `frontend/dist` exists (spec §9).
# `mime-guess` supplies the embedded assets' Content-Type.
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[features]
default = []
embed-frontend = ["dep:rust-embed", "poem/embed"]
# Builds the `seed` bin; prod images are built without it (spec §6).
seed = ["users/seed", "notes/seed"]

[dev-dependencies]
# Enables `seed` for the composed-app tests.
server = { path = ".", features = ["seed"] }
app-web.workspace = true
# The seeded ids the reaction test names.
users-api = { workspace = true, features = ["seed"] }
notes-api = { workspace = true, features = ["seed"] }
poem = { workspace = true, features = ["test"] }
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
