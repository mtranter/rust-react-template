[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Listed below, so a journeys' `tests/driver.rs` is a module of theirs rather than a target.
autotests = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "dump-spec"
path = "src/bin/dump-spec.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["seed"]

[[test]]
name = "composed_app"
path = "tests/composed_app.rs"

[[test]]
name = "worker_bin"
path = "tests/worker_bin.rs"

[dependencies]
access.workspace = true
assistant.workspace = true
connections.workspace = true
connections-api.workspace = true
ui-settings.workspace = true
ui-settings-api.workspace = true
app-authz.workspace = true
app-bus.workspace = true
app-db.workspace = true
app-domain.workspace = true
app-error.workspace = true
app-module.workspace = true
app-persistence.workspace = true
app-web.workspace = true
chrono.workspace = true
users.workspace = true
notes.workspace = true
note-search.workspace = true
poem.workspace = true
poem-openapi.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-http.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
figment.workspace = true
serde.workspace = true
serde_json.workspace = true

# Optional so the backend builds before `frontend/dist` exists (ADR 0005).
# `mime-guess` supplies the embedded assets' Content-Type.
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[features]
default = []
embed-frontend = ["dep:rust-embed", "poem/embed"]
# Builds the `seed` bin; prod images are built without it (ADR 0021).
seed = ["assistant/seed", "users/seed", "notes/seed"]

[dev-dependencies]
app-test-db.workspace = true
# `Jail`, for config tests that set environment variables.
figment = { workspace = true, features = ["test"] }
# Enables `seed` for the composed-app tests and journeys.
server = { path = ".", features = ["seed"] }
app-web = { workspace = true, features = ["test"] }
poem = { workspace = true, features = ["test"] }
serde_json.workspace = true
sqlx.workspace = true
strum.workspace = true
tokio.workspace = true
