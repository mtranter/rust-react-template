apiVersion: auth.flagrante.io/v1
resourcePolicy:
  resource: note
  version: default
  importDerivedRoles: [notes_scopes]
  rules:
    - name: archived notes are read-only
      actions: [edit, archive]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: R.attr.archived == true
