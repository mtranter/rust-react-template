[package]
name = "app-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
app-authz.workspace = true
app-domain.workspace = true
async-trait.workspace = true
app-error.workspace = true
app-persistence.workspace = true
chrono.workspace = true
thiserror.workspace = true
poem.workspace = true
poem-openapi.workspace = true
poem-mcpserver.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
tracing.workspace = true
tokio.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[features]
# Test-driver plumbing (`app_web::testing`); enabled only from dev-dependencies.
test = ["poem/test", "opentelemetry_sdk/testing", "dep:tracing-subscriber"]

[dev-dependencies]
poem = { workspace = true, features = ["test"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber.workspace = true
