[package]
name = "app-fake-oidc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The identity provider `make e2e` signs in through: test harness, never shipped.
[[bin]]
name = "fake-oidc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
jsonwebtoken.workspace = true
poem.workspace = true
# jsonwebtoken's own RSA and RNG, to make the signing key.
rand = "0.8"
rsa = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
url = "2"

[dev-dependencies]
app-web.workspace = true
reqwest.workspace = true
