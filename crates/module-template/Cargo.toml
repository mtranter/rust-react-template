[package]
name = "widgets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
app-domain.workspace = true
app-error.workspace = true
app-persistence.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
app-web.workspace = true
app-db.workspace = true
app-module.workspace = true
poem.workspace = true
poem-openapi.workspace = true
sqlx.workspace = true

[features]
# Never enabled in production builds.
seed = []

[dev-dependencies]
# Enables `seed` for this crate's integration tests.
widgets = { path = ".", features = ["seed"] }
app-test-support.workspace = true
app-web = { workspace = true, features = ["test"] }
tokio = { workspace = true }
serde_json.workspace = true
