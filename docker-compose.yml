# Local Postgres and Valkey for development, and, in the `observability`
# profile, an OTLP backend. Production does not use these.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The bus server instances and workers broadcast to each other over (ADR
  # 0039). Valkey, as production's ElastiCache Serverless for Valkey; any Redis
  # would do. Needed only once a module broadcasts.
  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Grafana with Tempo, Prometheus and Loki behind one OTLP endpoint, for
  # `make dev-observability`. Only in the `observability` profile, so a plain
  # `docker compose up` (and `make dev`) leaves it off.
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    profiles: [observability]
    ports:
      - "3000:3000" # Grafana, signed in as admin
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  pgdata:
